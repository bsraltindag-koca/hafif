<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3657E0">
<title>Hafif</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  /* renk paleti: Okyanus (varsayılan) / Nane / Mercan */
  --p1:#3657E0; --p2:#3FA9FF; --p1d:#8AA2FF;
  --card:#FFFFFF; --ink:#18201C; --ink2:#5F6863; --ink3:#97A09A;
  --acc:var(--p1);
  --bg:color-mix(in srgb,var(--p1) 5%,#F6F6F2);
  --line:color-mix(in srgb,var(--p1) 8%,#E6E6E0);
  --water:#2F8CFF; --move:#FF6B3D; --meal:#F0A400; --mind:#8B5CF6;
  --danger:#E0453A;
  --tint:12%;
  --shadow:0 1px 2px rgba(20,30,25,.04),0 4px 16px rgba(20,30,25,.04);
  /* tek yazı ölçeği */
  --fs-title:22px; --fs-card:15px; --fs-body:15px; --fs-btn:14px; --fs-sec:13px; --fs-label:11px;
  --r:18px;
}
:root[data-palette="coral"]{--p1:#EF5B4C; --p2:#FF9A6B; --p1d:#FF8A78}
:root[data-palette="mint"]{--p1:#0E9F77; --p2:#3CCB9E; --p1d:#4FD1A5}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --card:#1A1F1D; --ink:#EEF2EF; --ink2:#A5ADA8; --ink3:#6E7772;
    --acc:var(--p1d); --bg:#101413; --line:#2A312E;
    --water:#5AA6FF; --move:#FF8A62; --meal:#F5BC3A; --mind:#A98BFA;
    --danger:#FF7466; --tint:18%; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --card:#1A1F1D; --ink:#EEF2EF; --ink2:#A5ADA8; --ink3:#6E7772;
  --acc:var(--p1d); --bg:#101413; --line:#2A312E;
  --water:#5AA6FF; --move:#FF8A62; --meal:#F5BC3A; --mind:#A98BFA;
  --danger:#FF7466; --tint:18%; --shadow:none;
}
:root{
  --acc-soft:color-mix(in srgb,var(--acc) var(--tint),var(--card));
  --water-soft:color-mix(in srgb,var(--water) var(--tint),var(--card));
  --move-soft:color-mix(in srgb,var(--move) var(--tint),var(--card));
  --meal-soft:color-mix(in srgb,var(--meal) var(--tint),var(--card));
  --mind-soft:color-mix(in srgb,var(--mind) var(--tint),var(--card));
  --hero:linear-gradient(135deg,var(--p1) 0%,var(--p2) 100%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{background:radial-gradient(900px 340px at 50% -120px,color-mix(in srgb,var(--acc) 16%,transparent),transparent 70%) no-repeat,var(--bg)}
body{font:400 var(--fs-body)/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
svg{display:block}
.ui-ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ui-ico.sm{width:16px;height:16px}

/* ---------- iskelet ---------- */
.app-shell{min-height:100vh;display:flex;flex-direction:column}
.app-main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 92px)}
.app-nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);display:flex;justify-content:center}
.app-nav-in{display:flex;width:100%;max-width:520px;justify-content:space-around}
.app-tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;min-width:58px;color:var(--ink3);font-size:var(--fs-label);font-weight:500;letter-spacing:.01em}
.app-tab{position:relative}
.app-tab[aria-current="page"]{color:var(--acc);font-weight:600}
.app-tab[aria-current="page"]::after{content:"";position:absolute;bottom:-2px;width:4px;height:4px;border-radius:50%;background:var(--acc)}
@media (min-width:900px){.app-tab[aria-current="page"]::after{display:none}}
.app-tab .ui-ico{width:22px;height:22px}
.app-foot{text-align:center;color:var(--ink3);font-size:var(--fs-label);margin-top:22px}

@media (min-width:900px){
  .app-shell{flex-direction:row}
  .app-nav{position:sticky;top:0;height:100vh;width:200px;flex:none;border-top:0;border-right:1px solid var(--line);padding:28px 14px;align-items:flex-start;background:var(--bg)}
  .app-nav-in{flex-direction:column;gap:4px;justify-content:flex-start}
  .app-brand{display:flex!important}
  .app-tab{flex-direction:row;gap:12px;padding:10px 12px;border-radius:10px;font-size:var(--fs-btn);min-width:0}
  .app-tab[aria-current="page"]{background:var(--acc-soft)}
  .app-main{max-width:980px;padding:32px 36px 40px}
  .ui-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .ui-grid2>.ui-col{display:flex;flex-direction:column;gap:14px}
  .ui-grid2 .ui-card,.ui-grid2 .td-pair{margin:0}
}
.app-brand{display:none;align-items:center;gap:10px;font-weight:600;font-size:17px;padding:0 12px 22px;color:var(--ink)}

/* ---------- ortak parçalar ---------- */
.ui-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.ui-h1{font-size:var(--fs-title);font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.2}
.ui-sub{color:var(--ink2);font-size:var(--fs-sec);margin:2px 0 0}
.ui-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.ui-card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.ui-card-t{display:flex;align-items:center;gap:8px;font-size:var(--fs-card);font-weight:600;margin:0}
.ui-card-meta{color:var(--ink2);font-size:var(--fs-sec);white-space:nowrap}
.ui-label{display:block;color:var(--ink2);font-size:var(--fs-label);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.ui-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:var(--fs-btn);font-weight:500;color:var(--ink);white-space:nowrap}
.ui-btn.pri{background:var(--hero);border-color:transparent;color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--p1) 30%,transparent)}
.ui-btn.ghost{border-color:transparent;background:transparent;color:var(--acc);padding:0 8px}
.ui-btn.danger{color:var(--danger)}
.ui-btn.sm{height:32px;padding:0 12px;font-size:var(--fs-sec)}
.ui-btn:disabled{opacity:.45}
.ui-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ui-input{width:100%;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:0 12px;font-size:16px;outline:none}
.ui-input:focus,.ui-ta:focus{border-color:var(--acc)}
.ui-ta{width:100%;min-height:84px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 12px;font-size:16px;line-height:1.45;resize:vertical;outline:none}
.ui-field{margin-bottom:12px}
.ui-fields2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ui-chips{display:flex;flex-wrap:wrap;gap:6px}
.ui-chip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:var(--fs-sec);color:var(--ink2)}
.ui-chip[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);color:var(--acc);font-weight:500}
.ui-bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.ui-bar>i{display:block;height:100%;border-radius:99px;background:var(--hero);transition:width .4s}
.ui-empty-note{color:var(--ink3);font-size:var(--fs-sec);margin:0}
.ui-num{font-variant-numeric:tabular-nums}
.ui-hr{height:1px;background:var(--line);margin:12px 0;border:0}
.ui-switch{position:relative;width:44px;height:26px;flex:none}
.ui-switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.ui-switch i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.2s}
.ui-switch i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:.2s}
.ui-switch input:checked+i{background:var(--hero)}
.ui-switch input:checked+i::after{transform:translateX(18px)}
.ui-iconbtn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:var(--ink2)}
.ui-iconbtn:active{background:var(--line)}

/* sheet (alt pencere) */
.ui-sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(15,20,18,.38);display:flex;align-items:flex-end;justify-content:center;animation:uiFade .18s}
.ui-sheet{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 18px);animation:uiUp .22s ease-out}
.ui-sheet-grip{width:36px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.ui-sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.ui-sheet-t{font-size:17px;font-weight:600;margin:0}
.ui-sheet-f{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
@media (min-width:900px){.ui-sheet-bg{align-items:center}.ui-sheet{border-radius:20px;padding-bottom:18px}}
@keyframes uiFade{from{opacity:0}}
@keyframes uiUp{from{transform:translateY(30px);opacity:.5}}
.ui-toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 86px);transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:var(--fs-sec);box-shadow:0 6px 20px rgba(0,0,0,.18);max-width:calc(100% - 32px);text-align:center;animation:uiUp .2s}
@media (min-width:900px){.ui-toast{bottom:28px}}

/* ---------- giriş (onboarding) ---------- */
.ob-page{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:radial-gradient(120% 60% at 50% -10%,color-mix(in srgb,var(--p2) 30%,transparent),transparent 70%),radial-gradient(80% 40% at 100% 0%,color-mix(in srgb,var(--p1) 22%,transparent),transparent 70%),var(--bg)}
.ob-wrap{width:100%;max-width:440px;margin:0 auto;flex:1;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 18px)}
.ob-top{display:flex;align-items:center;gap:12px;height:36px;margin-bottom:12px}
.ob-dots{display:flex;gap:6px;flex:1;justify-content:center;padding-right:36px}
.ob-dots i{width:22px;height:5px;border-radius:9px;background:color-mix(in srgb,var(--acc) 20%,var(--line))}
.ob-dots i.on{background:var(--hero);width:34px}
.ob-wrap.ob-center{justify-content:center}
.ob-hero{text-align:center}
.ob-mark{width:84px;height:84px;margin:0 auto 18px;filter:drop-shadow(0 12px 24px color-mix(in srgb,var(--p1) 35%,transparent))}
.ob-mark svg{width:100%;height:100%}
.ob-name{font-size:34px;font-weight:700;letter-spacing:-.03em;margin:0}
.ob-tag{font-size:17px;color:var(--ink2);margin:6px 0 0}
.ob-feats{list-style:none;padding:0;margin:30px 0 0;display:flex;flex-direction:column;gap:10px;text-align:left}
.ob-feat{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--card) 80%,transparent);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ob-feat span{color:var(--acc)}
.ob-feat b{display:block;font-weight:600;font-size:var(--fs-body)}
.ob-feat small{display:block;color:var(--ink2);font-size:var(--fs-sec)}
.ob-h{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0}
.ob-sub{color:var(--ink2);font-size:var(--fs-body);margin:6px 0 16px}
.ob-field{margin-bottom:14px}
.ob-in{display:flex;align-items:center;height:52px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);padding:0 14px;transition:border-color .15s,box-shadow .15s}
.ob-in:focus-within{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 14%,transparent)}
.ob-in input{flex:1;min-width:0;width:100%;border:0;background:none;outline:none;font-size:18px;font-weight:500;height:100%}
.ob-in input[type=date]{font-size:17px;-webkit-appearance:none;appearance:none;color:var(--ink)}
.ob-in input::-webkit-date-and-time-value{text-align:left}
.ob-in input::placeholder{color:var(--ink3);font-weight:400}
.ob-in span{color:var(--ink2);font-size:var(--fs-btn);font-weight:500;margin-left:6px}
.ob-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.ob-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ob-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:64px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);font-weight:600;color:var(--ink2);transition:.15s}
.ob-card[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);background:var(--acc-soft);box-shadow:0 0 0 1px var(--acc) inset}
.ob-acts{display:flex;flex-direction:column;gap:8px}
.ob-act{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);text-align:left;transition:.15s}
.ob-act b{display:block;font-weight:600}
.ob-act small{display:block;color:var(--ink2);font-size:var(--fs-sec)}
.ob-act i{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;margin-left:auto;transition:.15s}
.ob-act[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.ob-act[aria-pressed="true"] i{border:6px solid var(--acc)}
.ob-sum{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--hero);color:#fff;margin:2px 0 16px;font-size:var(--fs-sec)}
.ob-sum b{font-size:var(--fs-body)}
.ob-err{color:var(--danger);font-size:var(--fs-sec);min-height:18px;margin:-4px 0 6px}
.ob-foot{margin-top:24px;display:flex;flex-direction:column;align-items:center;gap:10px}
.ob-foot .ui-btn{min-width:200px;height:50px;font-size:16px;font-weight:600}
.ob-privacy{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:var(--fs-sec)}
.ob-ver{text-align:center;color:var(--ink3);font-size:var(--fs-label)}
@media (max-height:600px){.ob-sub{display:none}.ob-h{margin-bottom:12px}.ob-act small{display:none}.ob-top{margin-bottom:8px}.ob-field{margin-bottom:10px}.ob-sum{margin-bottom:10px;padding:8px 12px}.ob-foot{margin-top:14px}.ob-act{padding:7px 12px}.ob-in{height:42px}.ob-foot .ui-btn{height:44px}.ob-feat small{display:none}.ob-name{font-size:28px}.ob-tag{font-size:15px}}
@media (max-height:700px){.ob-mark{width:64px;height:64px;margin-bottom:12px}.ob-feats{margin-top:18px}.ob-feat{padding:9px 12px}.ob-sub{margin-bottom:14px}.ob-act{padding:8px 12px}.ob-in{height:46px}}

/* ---------- bugün ---------- */
.av{width:40px;height:40px;border-radius:50%;flex:none;overflow:hidden;background:var(--hero);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:18px;box-shadow:0 0 0 2px var(--card),0 0 0 3.5px color-mix(in srgb,var(--acc) 45%,transparent)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.lg{width:72px;height:72px;font-size:28px}
.td-right{display:flex;align-items:center;gap:8px;flex:none;align-self:center}
.ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.ph-tile{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--bg)}
.ph-tile img{width:100%;height:100%;object-fit:cover;display:block}
.ph-tile i{position:absolute;left:6px;bottom:6px;width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.9)}
.ph-month{font-size:var(--fs-sec);color:var(--ink2);font-weight:600;margin:14px 0 6px}
.ph-month:first-child{margin-top:0}
.ph-cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ph-cmp figure{margin:0}
.ph-cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;display:block;background:var(--bg)}
.ph-cmp figcaption{font-size:var(--fs-sec);color:var(--ink2);margin-top:6px;text-align:center}
.ph-cmp figcaption b{display:block;color:var(--ink);font-size:var(--fs-body)}
.ph-cmp-sum{text-align:center;font-size:var(--fs-sec);color:var(--acc);font-weight:600;margin-top:10px}
.ph-view img{width:100%;max-height:60vh;object-fit:contain;border-radius:12px;background:var(--bg);display:block}
.ph-thumb{width:40px;height:40px;border-radius:10px;object-fit:cover;flex:none;background:var(--bg)}
.ph-attach{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ph-attach img{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--bg)}
.ph-pick{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:4/3;border:1.5px dashed var(--line);border-radius:14px;color:var(--ink2);gap:8px;font-size:var(--fs-btn);margin-bottom:12px;background:var(--bg)}
.ph-pick img{width:100%;height:100%;object-fit:cover;border-radius:13px}
@media (min-width:900px){.ph-grid{grid-template-columns:repeat(4,1fr)}}
.td-date{display:flex;align-items:center;gap:2px;margin-left:-8px}
.td-date span{color:var(--ink2);font-size:var(--fs-sec);min-width:0}
.td-streak{display:inline-flex;align-items:center;gap:5px;color:var(--move);background:var(--move-soft);padding:5px 10px 5px 8px;border-radius:999px;font-size:var(--fs-sec);font-weight:600;white-space:nowrap}
.td-hero{background:var(--hero);border:0;color:#fff;box-shadow:0 10px 30px color-mix(in srgb,var(--p1) 28%,transparent);position:relative;overflow:hidden}
.td-hero::after{content:"";position:absolute;right:-50px;top:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12);pointer-events:none}
.td-hero .ui-label,.td-hero .td-goal-row,.td-hero .td-goal-big small{color:rgba(255,255,255,.85)}
.td-hero .ui-bar{background:rgba(255,255,255,.28)}
.td-hero .ui-bar>i{background:#fff}
.td-hero .ui-btn{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.35);color:#fff;position:relative;z-index:1}
.td-goal-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.td-goal-big{font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.td-goal-big small{font-size:var(--fs-sec);font-weight:400;color:var(--ink2);letter-spacing:0;margin-left:4px}
.td-goal-row{display:flex;justify-content:space-between;color:var(--ink2);font-size:var(--fs-sec);margin-top:8px}
.td-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.td-pair .ui-card{margin:0}
.td-ringcard.water{background:var(--water-soft);border-color:transparent}
.td-ringcard.move{background:var(--move-soft);border-color:transparent}
.td-ringcard .ui-btn{background:var(--card);border-color:transparent}
.td-ringcard{display:flex;flex-direction:column;align-items:center;text-align:center;padding:16px 12px 14px}
.td-ringcard .ui-card-t{align-self:flex-start;margin-bottom:10px}
.td-ring{position:relative;width:104px;height:104px}
.td-ring-v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.td-ring-v b{font-size:22px;font-weight:600;letter-spacing:-.01em}
.td-ring-v span{font-size:var(--fs-label);color:var(--ink2)}
.td-ring-btns{display:flex;gap:6px;margin-top:12px}
.td-ring-btns .ui-btn{height:32px;padding:0 10px;font-size:var(--fs-sec)}
.td-meal{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.td-meal:first-of-type{border-top:0;padding-top:2px}

/* ---------------- yardımcılar ---------------- */
const $ = (s, r = document) => r.querySelector(s);

const pad = n => String(n).padStart(2, '0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return dkey(d); };

const diffDays = (a, b) => Math.round((parseKey(b) - parseKey(a)) / 864e5);
const MONTHS = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];

const fmt = (n, dec = 1) => (n == null || isNaN(n)) ? '–' : Number(n).toLocaleString('tr-TR', {minimumFractionDigits: 0, maximumFractionDigits: dec});

const num = v => { if (v == null || v === '') return null; const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; };
const longDate = k => { const d = parseKey(k); return `${d.getDate()} ${MONTHS[d.getMonth()]} ${DAYS[d.getDay()]}`; };

function rangeLabel(a, b) {
  const A = parseKey(a), B = parseKey(b);

  if (A.getMonth() !== B.getMonth()) return `${A.getDate()} ${MONTHS[A.getMonth()]} – ${B.getDate()} ${MONTHS[B.getMonth()]} ${B.getFullYear()}`;
  return `${A.getDate()} – ${B.getDate()} ${MONTHS[B.getMonth()]} ${B.getFullYear()}`;

// Türkçe harfleri sadeleştirir: "Çikolatası" → "cikolatasi"; böylece "cikolata" da "çikolata" da eşleşir
const fold = s => String(s || '').toLocaleLowerCase('tr').replace(/[çğıöşüâîû]/g, c => ({'ç':'c','ğ':'g','ı':'i','ö':'o','ş':'s','ü':'u','â':'a','î':'i','û':'u'}[c]));
function lev(a, b) {
  if (Math.abs(a.length - b.length) > 2) return 9;
  let prev = [...Array(b.length + 1).keys()];
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}

const UNIT_G = {'yemek kasigi': 15, 'kasik': 15, 'tatli kasigi': 7, 'cay kasigi': 3, 'su bardagi': 200, 'cay bardagi': 100, 'bardak': 200, 'fincan': 70, 'kupa': 250, 'kepce': 120, 'avuc': 30, 'sise': 500, 'kutu': 330, 'top': 50, 'olcek': 30, 'kup': 4, 'kare': 6};
const UNIT_RE = /^(yemek kasig\S*|tatli kasig\S*|cay kasig\S*|su bardag\S*|cay bardag\S*|kasik\S*|bardak\S*|fincan\S*|kupa|kepce\S*|avuc\S*|sise\S*|kutu\S*|top|olcek\S*|kup|kare|adet|tane|dilim\S*|porsiyon\S*|tabak\S*|kase\S*|gram|gr|g|ml)(?=\s|$)/;
const UNIT_NORM = u => u.startsWith('yemek kasig') ? 'kasik' : u.startsWith('tatli kasig') ? 'tatli kasigi' : u.startsWith('cay kasig') ? 'cay kasigi' : u.startsWith('su bardag') ? 'su bardagi' : u.startsWith('cay bardag') ? 'cay bardagi' : u.replace(/(kasik|bardak|fincan|kepce|avuc|sise|kutu|olcek|dilim|porsiyon|tabak|kase)\S*/, '$1');
// Öğün metinlerinde sık geçen ama yiyecek olmayan kelimeler (yanlış eşleşmesinler)
const STOP_RE = /^(biraz|az|cok|kadar|gibi|kahvalti\S*|ogle\S*|aksam\S*|sabah\S*|gece|yemeg\S*|yemek|ara|ogun\S*|tuzlu|soslu|sos\S*|baharat\S*|evde|ev|yapimi|disarida|icin|ile|hic|yok)$/;
const NUM_WORDS = {'yarim': .5, 'ceyrek': .25, 'bir': 1, 'iki': 2, 'uc': 3, 'dort': 4, 'bes': 5, 'alti': 6, 'yedi': 7, 'sekiz': 8, 'dokuz': 9, 'on': 10};
// Metindeki kelime dizisinde en iyi eşleşen yiyeceği bulur; tam eşleşme önce, sonra küçük yazım hatalarına tolerans
function bestFood(words) {
  let best = null;
  for (const f of FOOD_DB) for (const key of f.keys) {
    const n = key.split(' ').length, allow = key.length >= 7 ? 2 : key.length >= 4 ? 1 : 0;
    for (let i = 0; i + n <= words.length; i++) {
      const joined = words.slice(i, i + n).join(' ');
      let d = joined.startsWith(key) ? 0 : 9;
      if (d && allow && joined[0] === key[0]) for (let L = key.length - 1; L <= key.length + 1; L++) if (L > 2 && joined.length >= L) d = Math.min(d, lev(key, joined.slice(0, L)));
      if (d > allow) continue;
      const score = key.length * 10 - d * 25;
      if (!best || score > best.score) best = {food: f, i, n, score};
    }
  }
  return best;
}
function estimateMeal(text) {
  const parts = String(text || '').split(/[,;\n+]|\s+ve\s+|\s+ile\s+/i).map(x => x.trim()).filter(Boolean);
  const items = [];
  for (const raw of parts) {
    let t = fold(raw).split(/\s+/).filter(w => w && !STOP_RE.test(w)).join(' '), qty = null;
    let m = t.match(/^(\d+(?:[.,]\d+)?)(?:\s*[-–]\s*(\d+(?:[.,]\d+)?))?/);
    if (m) { qty = num(m[1]); if (m[2]) qty = (qty + num(m[2])) / 2; t = t.slice(m[0].length).trim(); }
    else if (/^½/.test(t)) { qty = .5; t = t.slice(1).trim(); }
    else { m = t.match(/^(yarim|ceyrek|bir|iki|uc|dort|bes|alti|yedi|sekiz|dokuz|on)(?=\s|$)(\s+bucuk(?=\s|$))?/); if (m) { qty = NUM_WORDS[m[1]] + (m[2] ? .5 : 0); t = t.slice(m[0].length).trim(); } }
    if (/^bucuk(?=\s|$)/.test(t)) { qty = (qty || 0) + .5; t = t.replace(/^bucuk\s*/, ''); }
    m = t.match(/^(\d+)\s*x(?=\s|$)/) || t.match(/(?:^|\s)x\s*(\d+)$/); if (m) { qty = (qty || 1) * +m[1]; t = t.replace(m[0], ' ').trim(); }
    const um = t.match(UNIT_RE); const unit = um ? UNIT_NORM(um[1]) : null;
    if (um) t = t.slice(um[0].length).trim();
    // Bir kalemde birden çok yiyecek olabilir ("kuru fasulye pilav")
    let words = t.split(/\s+/).filter(Boolean), kcal = null, first = true;
    const seen = new Set();
    for (let guard = 0; guard < 6 && words.length; guard++) {
      const hit = bestFood(words);
      if (!hit) break;
      const used = words.slice(hit.i, hit.i + hit.n);
      words = words.slice(0, hit.i).concat(words.slice(hit.i + hit.n));
      if (seen.has(hit.food)) continue;
      seen.add(hit.food);
      if (/s[iu]z$/.test(used[used.length - 1])) continue; // "şekersiz", "yağsız"
      if (/^s[iu]z$/.test(words[hit.i] || '')) { words.splice(hit.i, 1); continue; } // "şeker siz"
      const food = hit.food, q = first ? (qty ?? 1) : 1, un = first ? unit : null;
      let grams;
      if (un === 'gram' || un === 'gr' || un === 'g' || un === 'ml') grams = q;
      else if (un) grams = q * (food.u[un] ?? UNIT_G[un] ?? food.p);
      else grams = q * (food.u.adet && first && qty != null ? food.u.adet : food.p);
      kcal = (kcal || 0) + Math.round(food.k * grams / 100);
      first = false;
    }
    items.push({label: raw, kcal});
  }
  const known = items.filter(i => i.kcal != null);
  return {items, total: known.length ? known.reduce((a, i) => a + i.kcal, 0) : null};
}

    else if (a == null || a < 12 || a > 100) o.err = 'Doğum tarihini kontrol eder misin? Uygulama 12 yaş ve üzeri için.';
    else if (!h || h < 100 || h > 250) o.err = 'Boyunu santimetre olarak gir (örn. 165).';
  }
  if (o.step === 2) {
    const w = num(d.weight), g = num(d.goal);
    if (!w || w < 25 || w > 350) o.err = 'Şu anki kilonu gir (örn. 82,5).';
    else if (!g || g < 25 || g > 350) o.err = 'Hedef kilonu gir.';
    if (!o.err) {
      S.profile = {name: d.name.trim(), sex: d.sex, birth: d.birth, height: Math.round(num(d.height)), startWeight: w, goalWeight: g, activity: d.activity, startDate: todayKey()};
      S.weights.push({date: todayKey(), kg: w, fat: null, src: 'manual'});
      ui.ob = null; save(); syncReminders(); post({cmd: 'notifyPermission'}); render(); window.scrollTo(0, 0);
      return;
    }
  }
  if (!o.err) o.step++;
  render();
  if (!o.err) setTimeout(() => $('.ob-in input')?.focus({preventScroll: true}), 60);
}

/* ---- ölçüler ---- */
function ratioRows() {
  const E = measureEnds(), p = S.profile, f = p.sex !== 'm', rows = [];
  const waist = E.waist?.last, hip = E.hip?.last;
  const tone = lvl => ['var(--acc)', 'var(--meal)', 'var(--move)'][lvl];
  if (waist && hip) {
    const r = waist / hip, lvl = f ? (r <= .8 ? 0 : r <= .85 ? 1 : 2) : (r <= .95 ? 0 : r <= 1 ? 1 : 2);
    rows.push({n: 'Bel / kalça oranı', v: fmt(r, 2), lvl, d: ['Düşük risk', 'Orta risk', 'Yüksek risk'][lvl] + ` · ${f ? 'kadınlarda 0,85' : 'erkeklerde 1,0'} altı önerilir`});
  }
  if (waist && p.height) {
    const r = waist / p.height, lvl = r < .5 ? 0 : r < .6 ? 1 : 2;
    rows.push({n: 'Bel / boy oranı', v: fmt(r, 2), lvl, d: ['Sağlıklı aralık', 'Dikkat', 'Yüksek risk'][lvl] + ' · 0,5 altı önerilir'});
  }
  if (waist) {
    const lim = f ? 80 : 94, lvl = waist < lim ? 0 : waist < (f ? 88 : 102) ? 1 : 2;
    rows.push({n: 'Bel çevresi', v: `${fmt(waist)} cm`, lvl, d: lvl === 0 ? 'Önerilen sınırın altında' : `${f ? 'Kadınlarda' : 'Erkeklerde'} ${lim} cm altı önerilir · ${fmt(waist - lim)} cm kaldı`});
  }
  return rows.map(r => ({...r, c: tone(r.lvl)}));
}

/* ---- rapor ---- */
function weekData(ws) {
  const keys = [...Array(7)].map((_, i) => addDays(ws, i));
  const today = todayKey();
  const days = keys.map(k => ({k, d: peekDay(k), score: dayScore(k), future: k > today}));
  const past = days.filter(x => !x.future);
  const active = past.filter(x => hasData(x.d));
  const n = Math.max(1, past.length);
  const wg = waterGoal();
  const wBefore = weightOn(addDays(ws, -1)), wEnd = weightOn(keys[6]);
  const inWeek = S.weights.filter(w => w.date >= keys[0] && w.date <= keys[6]).sort((a, b) => a.date.localeCompare(b.date));
  const startW = wBefore?.kg ?? inWeek[0]?.kg, endW = inWeek.length ? inWeek[inWeek.length - 1].kg : null;
  const kcalDays = past.filter(x => mealKcal(x.d) > 0);
  const stepDays = past.filter(x => x.d.steps != null);
  return {
    keys, days, past, active,
    score: past.length ? Math.round(past.reduce((s, x) => s + x.score, 0) / n) : 0,
    waterAvg: past.reduce((s, x) => s + (x.d.water || 0), 0) / n,
    waterHit: past.filter(x => (x.d.water || 0) >= wg).length,
    exTotal: past.reduce((s, x) => s + exMin(x.d), 0),
    exDays: past.filter(x => exMin(x.d) > 0).length,
    exKcal: past.reduce((s, x) => s + exKcal(x.d), 0),
    kcalAvg: kcalDays.length ? kcalDays.reduce((s, x) => s + mealKcal(x.d), 0) / kcalDays.length : null,
    kcalDays: kcalDays.length,
    habitAvg: past.length ? past.reduce((s, x) => s + habitPct(x.d), 0) / n : 0,
    stepAvg: stepDays.length ? stepDays.reduce((s, x) => s + x.d.steps, 0) / stepDays.length : null,
    moodAvg: (() => { const m = past.filter(x => x.d.mood); return m.length ? m.reduce((s, x) => s + x.d.mood, 0) / m.length : null; })(),
    wDelta: startW != null && endW != null && (inWeek.length > 1 || wBefore) ? endW - startW : null,
    endW, wg,
    ...(() => { const b = measureEnds(addDays(ws, -1)).waist, e = measureEnds(keys[6]).waist; const inWk = S.measures.some(m => m.date >= keys[0] && m.date <= keys[6] && m.waist != null); return {waistEnd: inWk ? e?.last : null, waistDelta: inWk && b && e ? e.last - b.last : null}; })(),
  };
}
function insights(W) {
  const out = [];
  if (!W.active.length) return [['spark', 'Bu hafta için henüz kayıt yok. Günlük kayıtlar geldikçe rapor kendini dolduracak.']];
  if (W.wDelta != null) out.push(W.wDelta < -0.05 ? ['down', `Bu hafta ${fmt(-W.wDelta)} kg verdin. Sağlıklı tempo haftada 0,5–1 kg civarıdır.`] : W.wDelta > 0.05 ? ['trend', `Kilon bu hafta ${fmt(W.wDelta)} kg arttı. Su tutulması ve tuz da tartıyı oynatabilir; birkaç günlük eğilime bak.`] : ['target', 'Kilon bu hafta sabit kaldı. Sabit haftalar normaldir; düzeni bozma.']);
  out.push(['drop', `Su hedefini ${W.past.length} günün ${W.waterHit} gününde tutturdun.${W.waterHit < W.past.length / 2 ? ' Gün içine yayılmış hatırlatmalar işini kolaylaştırır.' : ''}`]);
  out.push(['run', W.exDays ? `${W.exDays} gün hareket ettin, toplam ${W.exTotal} dakika. ${W.exTotal >= 150 ? 'Haftalık 150 dakika önerisini geçtin.' : `Haftalık 150 dakikaya ${150 - W.exTotal} dakika kaldı.`}` : 'Bu hafta egzersiz kaydı yok. Günde 20 dakikalık yürüyüşle başlayabilirsin.']);
  const best = W.past.filter(x => hasData(x.d)).sort((a, b) => b.score - a.score)[0];
  if (best) out.push(['spark', `En iyi günün ${DAYS[parseKey(best.k).getDay()]} oldu (skor ${best.score}).`]);
  if (W.waistDelta != null && Math.abs(W.waistDelta) >= .1) out.push([W.waistDelta < 0 ? 'down' : 'trend', W.waistDelta < 0 ? `Belin bu hafta ${fmt(-W.waistDelta)} cm inceldi.` : `Bel ölçün bu hafta ${fmt(W.waistDelta)} cm arttı.`]);
  if (W.kcalAvg != null) out.push(['meal', `Kalori kaydettiğin ${W.kcalDays} günde ortalama ${fmtInt(W.kcalAvg)} kcal aldın (hedef ${fmtInt(kcalGoal())}).`]);
  return out;
}
function reportText(W) {
  const lines = [`Haftalık rapor · ${rangeLabel(W.keys[0], W.keys[6])}`, ''];
  lines.push(`Haftalık skor: ${W.score}/100`);
  if (W.endW != null) lines.push(`Kilo: ${fmt(W.endW)} kg${W.wDelta != null ? ` (${W.wDelta <= 0 ? '−' : '+'}${fmt(Math.abs(W.wDelta))} kg)` : ''}`);
  lines.push(`Su: ortalama ${fmt(W.waterAvg / 1000, 2)} L/gün, hedef ${W.waterHit}/${W.past.length} gün`);
  lines.push(`Egzersiz: ${W.exTotal} dk (${W.exDays} gün), ~${fmtInt(W.exKcal)} kcal`);
  if (W.kcalAvg != null) lines.push(`Kalori: ortalama ${fmtInt(W.kcalAvg)} kcal/gün (${W.kcalDays} gün kayıt)`);
  if (W.stepAvg != null) lines.push(`Adım: ortalama ${fmtInt(W.stepAvg)}/gün`);
  if (W.waistEnd != null) lines.push(`Bel: ${fmt(W.waistEnd)} cm${W.waistDelta != null ? ` (${W.waistDelta <= 0 ? '−' : '+'}${fmt(Math.abs(W.waistDelta))} cm)` : ''}`);
  lines.push(`Disiplin listesi: %${Math.round(W.habitAvg * 100)}`, '', 'Günler:');
  W.days.filter(x => !x.future).forEach(x => {
    const d = x.d, w = S.weights.find(z => z.date === x.k);
    const parts = [`su ${fmt((d.water || 0) / 1000, 2)} L`];
    if (w) parts.unshift(`${fmt(w.kg)} kg`);
    if (exMin(d)) parts.push(`egzersiz ${exMin(d)} dk`);
    if (mealKcal(d)) parts.push(`${fmtInt(mealKcal(d))} kcal`);
    lines.push(`- ${shortDate(x.k)} ${DAYS[parseKey(x.k).getDay()]}: ${parts.join(', ')}`);
    MEALS.forEach(m => { const ml = d.meals?.[m.id]; if (ml?.text) lines.push(`    ${m.n}: ${ml.text}${ml.kcal ? ` (${ml.kcal} kcal)` : ''}`); });
  });
  return lines.join('\n');
}

function drawMeasureChart(el) {
  const W = el.clientWidth || 320, H = el.clientHeight || 210, key = ui.mKey;
  const pts = sortedMeasures().filter(m => m[key] != null).map(m => ({date: m.date, v: m[key]}));
  if (pts.length < 2) { el.innerHTML = `<div style="height:100%;display:flex;align-items:center;justify-content:center;text-align:center" class="ui-empty-note">Grafik için bu bölgede en az iki ölçüm gerekiyor.</div>`; return; }
  const pl = 34, pr = 12, pt = 14, pb = 22;
  const lo = Math.floor(Math.min(...pts.map(p => p.v)) - 1), hi = Math.ceil(Math.max(...pts.map(p => p.v)) + 1);
  const t0 = parseKey(pts[0].date), span = Math.max(1, parseKey(pts[pts.length - 1].date) - t0);
  const X = k => pl + (parseKey(k) - t0) / span * (W - pl - pr), Y = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
  const step = Math.max(1, Math.ceil((hi - lo) / 4));
  let g = '';
  for (let v = lo; v <= hi; v += step) g += `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pl - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`;
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.date).toFixed(1)},${Y(p.v).toFixed(1)}`).join('');
  const area = line + `L${X(pts[pts.length - 1].date)},${H - pb}L${X(pts[0].date)},${H - pb}Z`;
  const ends = [pts[0], pts[pts.length - 1]];
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="msg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--acc)" stop-opacity=".18"/><stop offset="1" stop-color="var(--acc)" stop-opacity="0"/></linearGradient></defs>
    ${g}<path d="${area}" fill="url(#msg)"/><path d="${line}" fill="none" stroke="var(--acc)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p => `<circle cx="${X(p.date)}" cy="${Y(p.v)}" r="3.2" fill="var(--card)" stroke="var(--acc)" stroke-width="1.6"/>`).join('')}
    ${ends.map((p, i) => `<text x="${X(p.date)}" y="${H - 5}" text-anchor="${i ? 'end' : 'start'}">${shortDate(p.date)}</text>`).join('')}
    <text x="${X(ends[1].date) - 4}" y="${Y(ends[1].v) - 12}" text-anchor="end" style="fill:var(--acc);font-weight:600;paint-order:stroke;stroke:var(--card);stroke-width:4px">${fmt(ends[1].v)} cm</text></svg>`;
}
function drawWeightChart(el) {
  const W = el.clientWidth || 320, H = el.clientHeight || 210, p = S.profile;
  let ws = sortedWeights();
  if (ui.range) { const from = addDays(todayKey(), -ui.range); ws = ws.filter(w => w.date >= from); }
  if (ws.length < 2) { el.innerHTML = `<div style="height:100%;display:flex;align-items:center;justify-content:center;text-align:center" class="ui-empty-note">Grafik için en az iki tartı gerekiyor.</div>`; return; }
  const pl = 34, pr = 10, pt = 12, pb = 22;
  const vals = ws.map(w => w.kg).concat([p.goalWeight]);
  let lo = Math.floor(Math.min(...vals) - 1), hi = Math.ceil(Math.max(...vals) + 1);
  const t0 = parseKey(ws[0].date), t1 = parseKey(ws[ws.length - 1].date), span = Math.max(1, (t1 - t0));
  const X = k => pl + (parseKey(k) - t0) / span * (W - pl - pr);
  const Y = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);

    }
    case 'weekNav': { const n = addDays(ui.week, +v); if (n <= weekStart(todayKey())) { ui.week = n; render(); } break; }
    case 'copyReport': { const t = reportText(weekData(ui.week)); (navigator.clipboard?.writeText(t) || Promise.reject()).then(() => toast('Rapor panoya kopyalandı'), () => toast('Kopyalanamadı')); break; }
    case 'shareReport': navigator.share({title: 'Haftalık rapor', text: reportText(weekData(ui.week))}).catch(() => {}); break;
    case 'editProfile': openSheet({type: 'profile'}); break;
    case 'profileSave': {
      const p = S.profile, birth = $('#pf-birth').value || p.birth, a = birth ? ageOf({birth}) : p.age, h = num($('#pf-h').value), sw = num($('#pf-s').value), g = num($('#pf-g').value);
      if (!a || !h || !sw || !g) { toast(birth || p.age ? 'Tüm alanları doldur' : 'Doğum tarihini seç'); return; }
      if (a < 12 || a > 100) { toast('Doğum tarihini kontrol et'); return; }
      Object.assign(p, {name: $('#pf-name').value.trim() || p.name, ...(birth ? {birth} : {}), height: Math.round(h), startWeight: sw, goalWeight: g, sex: chipVal('sex'), activity: +chipVal('activity')});
      save(); syncReminders(); closeSheet(); break;
    }
    case 'remToggle': S.settings.rem[v].on = el.checked; save(); syncReminders(); render(); break;
    case 'waterEvery': S.settings.rem.water.every = +v; save(); syncReminders(); render(); break;
    case 'askNotif': try { Promise.resolve(Notification.requestPermission()).then(() => render(), () => toast('Bildirim izni istenemedi')); } catch { toast('Bu ortamda bildirim izni istenemiyor'); } break;
    case 'delHabit': { const h = S.habits.find(x => x.id === v); confirmBox('Maddeyi sil', `“${esc(h.n)}” listeden çıkarılacak.`, 'Sil', () => { S.habits = S.habits.filter(x => x.id !== v); save(); }); break; }
    case 'theme': S.settings.theme = v; save(); render(); break;
    case 'palette': S.settings.palette = v; S.settings.paletteChosen = true; save(); render(); break;
    case 'export': {
      if (NATIVE) { post({cmd: 'share', name: `hafif-yedek-${todayKey()}.json`, text: JSON.stringify(S, null, 1)}); break; }
      const blob = new Blob([JSON.stringify(S, null, 1)], {type: 'application/json'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `hafif-yedek-${todayKey()}.json`; a.click(); break;
    }
    case 'import': pickFile('.json,application/json', txt => {
      let data; try { data = JSON.parse(txt); } catch { toast('Dosya okunamadı'); return; }
      if (!data?.profile || !data.days) { toast('Bu bir Hafif yedeği değil'); return; }
      confirmBox('Yedekten yükle', 'Bu cihazdaki mevcut kayıtların yedektekilerle değiştirilecek.', 'Yükle', () => { localStorage.setItem(STORE_KEY, JSON.stringify(data)); load(); syncReminders(); toast('Yedek yüklendi'); }, false);
    }); break;
    case 'reset': confirmBox('Tüm verileri sil', 'Profilin, tartıların, öğünlerin, notların ve fotoğrafların bu cihazdan kalıcı olarak silinecek. Geri alınamaz.', 'Hepsini sil', () => { localStorage.removeItem(STORE_KEY); PDB.clear().catch(() => {}); load(); ui.tab = 'today'; post({cmd: 'notify', items: []}); }); break;
    case 'confirmYes': { const fn = confirmFn; confirmFn = null; ui.sheet = null; fn?.(); render(); break; }
    case 'closeSheet': case 'sheetBg': closeSheet(); break;
  }
});
// Alt pencere açıkken yazılanı kaybetmeden yeniden çiz
function keepSheet() {
  const vals = [...document.querySelectorAll('.ui-sheet input[id], .ui-sheet textarea[id]')].map(e => [e.id, e.value]);
  const sc = $('.ui-sheet')?.scrollTop;
  render();
  vals.forEach(([id, v]) => { const e = document.getElementById(id); if (e && !e.disabled) e.value = v; });
  if (ui.sheet?.type === 'meal') syncMealKcal(); // tahmin kutusu geri yüklenen metne göre yenilensin
  if (sc) $('.ui-sheet').scrollTop = sc;
  $('.ui-sheet-bg').style.animation = 'none'; $('.ui-sheet').style.animation = 'none';
}
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'ob-form') { obNext(); }

  if (e.target.id === 'st-habit-form') {
    const n = e.target.h.value.trim(); if (!n) return;
    S.habits.push({id: uid(), n}); save(); render();
  }
});
let noteT;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.ob && ui.ob) {
    ui.ob.d[t.dataset.ob] = t.value;
    if (ui.ob.err) { ui.ob.err = ''; const er = $('.ob-err'); if (er) er.textContent = ''; }
    if (ui.ob.step === 2 && (t.dataset.ob === 'weight' || t.dataset.ob === 'goal')) { const tmp = document.createElement('div'); tmp.innerHTML = renderOnboarding(); $('#ob-sum').innerHTML = tmp.querySelector('#ob-sum').innerHTML; }
  }
  if (t.id === 'sh-text') syncMealKcal();
  if (t.id === 'sh-kcal') { ui.sheet.manual = t.value.trim() !== ''; syncMealKcal(); }
  if (t.id === 'td-note') { clearTimeout(noteT); noteT = setTimeout(() => { day(ui.day).note = t.value; save(); const s = $('#td-saved'); if (s) s.textContent = 'Kaydedildi'; }, 400); }
  if (t.id === 'jr-why') { clearTimeout(noteT); noteT = setTimeout(() => { S.why = t.value.trim(); save(); const s = $('#jr-saved'); if (s) s.textContent = 'Kaydedildi'; }, 400); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.ob && ui.ob) ui.ob.d[t.dataset.ob] = t.value;
  if (t.id === 'ms-date' && ui.sheet?.type === 'measure' && t.value) { ui.sheet.date = t.value; keepSheet(); return; }
  if (t.dataset.csv && ui.sheet?.type === 'csv') { ui.sheet.map[t.dataset.csv] = t.dataset.csv === 'dayFirst' ? t.value === '1' : +t.value; keepSheet(); return; }
  if (t.dataset.set) { const n = num(t.value); const k = t.dataset.set; S.settings[k] = n && n > 0 ? Math.round(n) : (['waterGoal', 'kcalGoal'].includes(k) ? null : S.settings[k]); if (k === 'glass' && !(n > 0)) S.settings.glass = 250; save(); syncReminders(); render(); }
  if (t.dataset.rem) { const [a, b] = t.dataset.rem.split('.'); if (t.value) { S.settings.rem[a][b] = b === 'wd' ? +t.value : t.value; save(); syncReminders(); render(); } }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.sheet) closeSheet(); });
// Gün değişince bugünü güncelle
let lastToday = todayKey();
setInterval(() => { const t = todayKey(); if (t !== lastToday) { if (ui.day === lastToday) ui.day = t; lastToday = t; if (!ui.sheet && document.activeElement?.tagName !== 'TEXTAREA') render(); } }, 60000);

window.addEventListener('error', e => { try { toast('Bir hata oluştu: ' + (e.message || 'bilinmiyor')); } catch {} });
load(); render();
if (S.profile) { syncReminders(); if (S.settings.health) post({cmd: 'health', days: 120}); }
</script>
</body>
